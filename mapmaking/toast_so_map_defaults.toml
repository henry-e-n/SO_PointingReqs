SO mapmaking pipeline

options:
  -h, --help            show this help message and exit
  --out_dir OUT_DIR     The output directory
  --obsmaps             Map each observation separately.
  --detmaps             Map each detector separately.
  --intervalmaps        Map each interval separately.
  --preprocess_copy     Perform preprocessing on a copy of the data.
  --log_config LOG_CONFIG
                        Dump out config log to this yaml file
  --hardware HARDWARE   Input hardware file
  --det_info_file DET_INFO_FILE
                        Input detector info file for real hardware maps
  --det_info_version DET_INFO_VERSION
                        Detector info file version such as 'Cv4'
  --thinfp THINFP       Thin the focalplane by this factor
  --bands BANDS         Comma-separated list of bands: LAT_f030 (27GHz),
                        LAT_f040 (39GHz), LAT_f090 (93GHz), LAT_f150 (145GHz),
                        LAT_f230 (225GHz), LAT_f290 (285GHz), SAT_f030
                        (27GHz), SAT_f040 (39GHz), SAT_f090 (93GHz), SAT_f150
                        (145GHz), SAT_f230 (225GHz), SAT_f290 (285GHz).
  --telescope TELESCOPE
                        Telescope to simulate: LAT, SAT1, SAT2, SAT3, SAT4.
  --tube_slots TUBE_SLOTS
                        Comma-separated list of optics tube slots: c1
                        (LAT_UHF), i5 (LAT_UHF), i6 (LAT_MF), i1 (LAT_MF), i3
                        (LAT_MF), i4 (LAT_MF), o6 (LAT_LF), ST1 (SAT_MF), ST2
                        (SAT_MF), ST3 (SAT_UHF), ST4 (SAT_LF).
  --wafer_slots WAFER_SLOTS
                        Comma-separated list of wafer slots.
  --sample_rate SAMPLE_RATE
                        Sampling rate
  --schedule SCHEDULE   Input observing schedule
  --sort_schedule       Sort the observing schedule by mean boresight RA. This
                        can limit the area of sky each process group deals
                        with.
  --realization REALIZATION
                        Realization index
  --pwv_limit PWV_LIMIT
                        If set, discard observations with simulated PWV higher
                        than the limit [mm]
  --full_pointing       Save detector pointing rather than regenerating to
                        save memory.
  --dry_run             Exit after setting up job options.
  --config CONFIG [CONFIG ...]
                        One or more input config files.
  --job_group_size JOB_GROUP_SIZE
                        (Advanced) Size of the process groups
  --job_node_mem JOB_NODE_MEM
                        (Advanced) Override the detected memory per node in
                        bytes
  --defaults DEFAULTS   Dump default config values to a file
